name: NARS v4 CI

on:
  pull_request:
    paths:
      - 'services/nars/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'ops/production-source-manifest.json'
      - 'scripts/verify-production-source-manifest.mjs'
      - '.github/workflows/nars-ci.yml'
  push:
    branches:
      - nars-v4-foundation
      - nars-v4-shadow-data-plane
      - nars-v4-event-clustering
      - nars-v4-evidence-scoring
      - nars-v4-source-provenance
      - nars-v4-primary-resolver
      - nars-v4-source-diversification-clean
      - nars-v4-dynamic-connectors
      - nars-v4-official-feeds
      - nars-v4-calibration-cutover
      - nars-v4-primary-evidence-acquisition
      - nars-v4-primary-evidence-matching
      - nars-v4-cutover-evidence-debt
      - codex/bo-vnext-s0-source-truth
    paths:
      - 'services/nars/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'ops/production-source-manifest.json'
      - 'scripts/verify-production-source-manifest.mjs'
      - '.github/workflows/nars-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/nars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/nars/package.json
      - name: Verify Production source truth
        working-directory: ${{ github.workspace }}
        run: node scripts/verify-production-source-manifest.mjs
      - name: Install pinned dependencies
        run: npm install --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Worker type check
        run: npm run check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Supabase Edge Function type check
        run: |
          find supabase/functions -name index.ts -print0 \
            | sort -z \
            | xargs -0 -n1 deno check --config deno.json
