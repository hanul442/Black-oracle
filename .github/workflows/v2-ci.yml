name: Black Oracle CI

on:
  push:
    branches:
      - feat/oracle-field-v2
      - main
      - sprint/6-empirical-paper-validation
      - sprint/7-supabase-native-pwa
  pull_request:
    branches:
      - main
      - sprint/5r-terminal-ui-actual
      - sprint/6-empirical-paper-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run lint
      - name: Production build
        run: npm run build
