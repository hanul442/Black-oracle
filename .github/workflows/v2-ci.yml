name: Black Oracle CI

on:
  push:
    branches:
      - feat/oracle-field-v2
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security gate
        # High and critical advisories block release. Remaining moderate Express 4/qs advisories
        # are visible in the audit output and must not be silently upgraded through an unsupported override.
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build
