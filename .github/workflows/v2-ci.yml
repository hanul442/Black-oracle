name: Black Oracle CI

on:
  push:
    branches:
      - feat/oracle-field-v2
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit evidence
        # Evidence-only until the existing advisory set is triaged. Do not convert unknown historical
        # advisories into a false clean bill of health or block unrelated PAPER validation work.
        run: npm audit --audit-level=critical || true

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build
