name: Black Oracle Paper Live Sanity

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/paper-live-sanity.ts'
      - '.github/workflows/paper-live-sanity.yml'

permissions:
  contents: read

jobs:
  live-paper-sanity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Live Evidence-First Paper cycle
        env:
          TRADING_PERSISTENCE_BACKEND: json
          TRADING_STATE_FILE: /tmp/black-oracle-paper-live-sanity.json
        run: npx tsx scripts/paper-live-sanity.ts
