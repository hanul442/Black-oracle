name: Sprint 5 Dependency Autofix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'sprint/5-evidence-governed-validation-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Sprint 5 head
        uses: actions/checkout@v4
        with:
          ref: sprint/5-evidence-governed-validation-closure
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply safe lockfile audit fixes
        # npm exits non-zero while any advisory remains. Preserve the safe lockfile changes,
        # then verify that the refreshed lock installs before committing them.
        run: npm audit fix --package-lock-only || true

      - name: Verify refreshed lockfile installs
        run: npm ci

      - name: Report remaining advisories
        run: npm audit --audit-level=critical || true

      - name: Commit lockfile refresh if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No safe lockfile changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh audited transitive dependencies"
          git push origin HEAD:sprint/5-evidence-governed-validation-closure
