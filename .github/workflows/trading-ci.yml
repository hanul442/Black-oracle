name: Black Oracle Trading CI

on:
  push:
    branches:
      - feat/trading-core-v0.1
      - integration/black-oracle-v0.2
  pull_request:
    branches:
      - feat/oracle-field-v2
      - main

permissions:
  contents: read

jobs:
  validate-trading-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Trading core tests
        run: npm run test:trading

      - name: Serverless bundle smoke
        run: npm run test:serverless-bundle

      - name: Production build
        run: npm run build
