name: Black Oracle Trading CI

on:
  push:
    branches:
      - feat/trading-core-v0.1
      - integration/black-oracle-v0.2
      - sprint/6-empirical-paper-validation
      - sprint/7-validation-integrity-target-contract
  pull_request:
    branches:
      - feat/oracle-field-v2
      - main
      - sprint/5r-terminal-ui-actual

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate-trading-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Trading core tests
        run: npm run test:trading

      - name: Build trading runtime bundle
        run: npx esbuild server/trading/runtimeBundleEntry.ts --bundle --platform=node --format=esm --target=node22 --outfile=server/trading/runtime-bundle.mjs

      - name: Serverless Paper-cycle bundle smoke
        run: npx esbuild api/trading-paper-cycle.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/black-oracle-trading-paper-cycle.mjs

      - name: Serverless Evidence-refresh bundle smoke
        run: npx esbuild api/trading-evidence-refresh.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/black-oracle-trading-evidence-refresh.mjs

      - name: Serverless Trading-readiness bundle smoke
        run: npx esbuild api/trading-readiness.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/black-oracle-trading-readiness.mjs

      - name: Serverless Promotion-readiness bundle smoke
        run: npx esbuild api/trading-promotion-readiness.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/black-oracle-trading-promotion-readiness.mjs

      - name: Supabase scheduler Edge bundle smoke
        run: npx esbuild supabase/functions/black-oracle-paper-scheduler/index.ts --bundle --platform=neutral --format=esm --target=es2022 '--external:jsr:*' '--external:npm:*' --outfile=/tmp/black-oracle-paper-scheduler.mjs

      - name: Production build
        run: npm run build
